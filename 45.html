  --cyan: #00E5FF;
  --purple: #A855F7;
  --pink: #F472B6;
  --line: rgba(148, 197, 255, 0.16);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1526;
    --surface: #0E1E38;
    --surface-2: #132747;
    --ink: #F4F8FF;
    --muted: #A9BDD8;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Poppins', system-ui, sans-serif;
}

a {
  color: inherit;
}

::-moz-selection {
  background: var(--cyan);
  color: #06121f;
}

::selection {
  background: var(--cyan);
  color: #06121f;
}

.display-font {
  font-family: 'Fredoka', 'Poppins', system-ui, sans-serif;
}

.text-glow {
  text-shadow: 0 0 24px rgba(0,229,255,.45);
}

.portrait-ring {
  background: conic-gradient(from 20deg, #00e5ff, #a855f7, #f472b6, #00e5ff);
  box-shadow: 0 0 0 6px rgba(0,229,255,.12), 0 0 55px rgba(0,229,255,.48), 0 0 95px rgba(168,85,247,.42);
}

.portrait-glow {
  background: radial-gradient(circle, rgba(0,229,255,.32) 0%, rgba(168,85,247,.22) 42%, transparent 68%);
  filter: blur(18px);
}

.card-hover {
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}

.card-hover:hover {
  transform: translateY(-5px);
  border-color: rgba(0,229,255,.45);
  box-shadow: 0 18px 40px rgba(0,0,0,.28);
}

.nav-link {
  position: relative;
}

.nav-link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  height: 2px;
  width: 0;
  background: var(--cyan);
  transition: width .2s ease;
}

.nav-link:hover::after, .nav-link.active::after {
  width: 100%;
}

.skill-bar {
  height: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,.12);
  overflow: hidden;
}

.skill-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #00e5ff, #a855f7);
}

.hover\:bg-white:hover{

}

.hover\:text-\[\#06121f\]:hover{
  --tw-text-opacity: 1;

}

.hover\:text-white:hover{
